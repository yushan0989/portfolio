<style>
  :root {
    --bone:        #f4f1ea;
    --bone-soft:   #ece7dc;
    --paper:       #fbf9f3;
    --ink:         #0e1f24;
    --ink-2:       #2c4148;
    --ink-3:       #5b7079;
    --ink-4:       #94a4ac;
    --kelp:        oklch(0.62 0.10 165);
    --kelp-deep:   oklch(0.46 0.10 170);
    --kelp-soft:   oklch(0.92 0.04 160);
    --tide:        oklch(0.66 0.09 210);
    --tide-deep:   oklch(0.42 0.08 215);
    --tide-soft:   oklch(0.92 0.03 210);
    --foam:        oklch(0.96 0.02 180);
    --coral:       oklch(0.72 0.13 35);
    --line:        rgba(14,31,36,0.10);
    --line-2:      rgba(14,31,36,0.18);
    --serif: 'Newsreader', Georgia, serif;
    --sans:  'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
    --mono:  'JetBrains Mono', ui-monospace, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bone);
    color: var(--ink);
    font-family: var(--sans);
    font-weight: 400;
    line-height: 1.6;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 999;
    opacity: 0.04;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size: 180px;
  }

  #ocean-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  #app { position: relative; z-index: 1; }

  ::selection { background: var(--kelp-soft); color: var(--ink); }

  .mono { font-family: var(--mono); font-variant-ligatures: none; }
  .serif { font-family: var(--serif); font-optical-sizing: auto; }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-3);
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .eyebrow .tick { width: 22px; height: 1px; background: currentColor; opacity: 0.5; }

  .glass {
    background: rgba(251,249,243,0.55);
    backdrop-filter: blur(14px) saturate(1.05);
    -webkit-backdrop-filter: blur(14px) saturate(1.05);
    border: 1px solid rgba(255,255,255,0.6);
    box-shadow: 0 1px 0 rgba(255,255,255,0.7) inset, 0 30px 60px -28px rgba(14,31,36,0.18), 0 6px 16px -8px rgba(14,31,36,0.10);
    border-radius: 18px;
  }

  .reveal {
    opacity: 0;
    transform: translateY(22px);
    transition: opacity 0.75s cubic-bezier(0.22,1,0.36,1), transform 0.75s cubic-bezier(0.22,1,0.36,1);
  }
  .reveal.in { opacity: 1; transform: none; }

  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 11px 20px; border-radius: 999px;
    font-family: var(--sans); font-size: 13px; font-weight: 500;
    letter-spacing: 0.01em; text-decoration: none; cursor: pointer;
    border: 1px solid transparent; white-space: nowrap;
    transition: transform 0.2s, box-shadow 0.2s, background 0.2s, color 0.2s, border-color 0.2s;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn .arrow { transition: transform 0.25s; display: inline-block; }
  .btn:hover .arrow { transform: translate(2px, -2px); }

  .btn-primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .btn-primary:hover { background: var(--kelp-deep); border-color: var(--kelp-deep); box-shadow: 0 8px 24px -10px var(--kelp-deep); }

  .btn-ghost { background: rgba(255,255,255,0.45); color: var(--ink-2); border-color: var(--line-2); backdrop-filter: blur(8px); }
  .btn-ghost:hover { background: rgba(255,255,255,0.85); color: var(--ink); }

  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(14,31,36,0.18); border-radius: 999px; border: 2px solid var(--bone); }

  #cursor-blob {
    position: fixed; top: 0; left: 0;
    width: 110px; height: 110px; border-radius: 50%;
    background: radial-gradient(circle at center, oklch(0.85 0.10 175 / 0.30), oklch(0.85 0.10 175 / 0) 60%);
    pointer-events: none; z-index: 0;
    transform: translate(-50%,-50%); transition: opacity 0.4s; opacity: 0;
    will-change: transform; filter: blur(8px);
  }
  body.cursor-on #cursor-blob { opacity: 1; }

  @keyframes livePulse {
    0%, 100% { box-shadow: 0 0 0 4px rgba(110,180,150,0.16); }
    50%       { box-shadow: 0 0 0 8px rgba(110,180,150,0.04); }

  .fig-img { background: rgba(255,255,255,0.7); border-radius: 12px; overflow: hidden; border: 1px solid rgba(14,31,36,0.10); }
  .fig-img img { width: 100%; display: block; }
  .fig-cap { font-size: 13px; color: #94a4ac; font-style: italic; margin-top: 8px; line-height: 1.5; }
  .fig-body { font-size: 15px; line-height: 1.75; color: #2c4148; }
  .fig-body p { margin-bottom: 12px; }
  .fig-body strong { color: #0e1f24; }
  @media (max-width: 800px) { .fig-row-2, .fig-row-eq { grid-template-columns: 1fr !important; } }
</style>

<body>

<canvas id="ocean-bg"></canvas>
<div id="cursor-blob"></div>
<div id="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script>
(function () {
  const canvas = document.getElementById('ocean-bg');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
  let mouseX=0.5,mouseY=0.4,scrollY=0,t=0,lastFrame=0;

  function resize() {
    W=window.innerWidth; H=window.innerHeight;
    canvas.width=W*DPR; canvas.height=H*DPR;
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  resize();
  window.addEventListener('resize',resize);
  window.addEventListener('mousemove',(e)=>{mouseX=e.clientX/W;mouseY=e.clientY/H;});
  window.addEventListener('scroll',()=>{scrollY=window.scrollY;},{passive:true});

  function hash(x,y){const s=Math.sin(x*374.123+y*219.317)*43758.5453;return s-Math.floor(s);}
  function smooth(t){return t*t*(3-2*t);}
  function vnoise(x,y){
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);
    const u=smooth(xf),v=smooth(yf);
    return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
  }
  function fbm(x,y){let v=0,amp=0.5,freq=1;for(let i=0;i<4;i++){v+=vnoise(x*freq,y*freq)*amp;amp*=0.5;freq*=2;}return v;}

  function draw(){
    const now=performance.now();
    if(now-lastFrame<33){requestAnimationFrame(draw);return;}
    lastFrame=now; t+=0.0014;
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#f6f3ec');g.addColorStop(0.55,'#eef0e8');g.addColorStop(1,'#e6ecea');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    const cols=80,rows=Math.round(cols*(H/W)),cw=W/cols,ch=H/rows;
    const sf=scrollY*0.0008,mx=(mouseX-0.5)*0.6,my=(mouseY-0.5)*0.6;
    const levels=[0.30,0.40,0.50,0.58,0.66,0.74];
    const colors=['rgba(20,90,90,0.04)','rgba(20,90,90,0.06)','rgba(20,90,90,0.08)','rgba(35,110,100,0.10)','rgba(45,120,110,0.12)','rgba(55,130,115,0.14)'];
    const field=new Float32Array((cols+1)*(rows+1));
    for(let y=0;y<=rows;y++)for(let x=0;x<=cols;x++)field[y*(cols+1)+x]=fbm(x/cols*3+t+mx,y/rows*3+sf+my);
    ctx.lineWidth=1; ctx.lineCap='round';
    for(let li=0;li<levels.length;li++){
      const level=levels[li];
      ctx.strokeStyle=colors[li];
      ctx.beginPath();
      for(let y=0;y<rows;y++){
        for(let x=0;x<cols;x++){
          const a=field[y*(cols+1)+x],b=field[y*(cols+1)+x+1],c=field[(y+1)*(cols+1)+x+1],d=field[(y+1)*(cols+1)+x];
          let idx=0;
          if(a>level)idx|=1;if(b>level)idx|=2;if(c>level)idx|=4;if(d>level)idx|=8;
          if(idx===0||idx===15)continue;
          const px=x*cw,py=y*ch,lerp=(v1,v2)=>(level-v1)/(v2-v1);
          const top=[px+cw*lerp(a,b),py],right=[px+cw,py+ch*lerp(b,c)],bottom=[px+cw*lerp(d,c),py+ch],left=[px,py+ch*lerp(a,d)];
          const seg=(p1,p2)=>{ctx.moveTo(p1[0],p1[1]);ctx.lineTo(p2[0],p2[1]);};
          switch(idx){
            case 1:case 14:seg(left,top);break;case 2:case 13:seg(top,right);break;
            case 3:case 12:seg(left,right);break;case 4:case 11:seg(right,bottom);break;
            case 5:seg(left,top);seg(right,bottom);break;case 6:case 9:seg(top,bottom);break;
            case 7:case 8:seg(left,bottom);break;case 10:seg(left,bottom);seg(top,right);break;
          }
        }
      }
      ctx.stroke();
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  const blob=document.getElementById('cursor-blob');
  let bx=window.innerWidth/2,by=window.innerHeight/2,tx=bx,ty=by;
  document.addEventListener('mousemove',(e)=>{tx=e.clientX;ty=e.clientY;document.body.classList.add('cursor-on');});
  function tickBlob(){bx+=(tx-bx)*0.12;by+=(ty-by)*0.12;if(blob)blob.style.transform=`translate(${bx}px,${by}px) translate(-50%,-50%)`;requestAnimationFrame(tickBlob);}
  tickBlob();
})();
</script>

<script type="text/babel">
const { useEffect, useState } = React;

function IconArrow({ size = 14 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 16 16" fill="none">
      <path d="M3 13 L13 3 M6 3 L13 3 L13 10" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

function IconArrowLeft({ size = 14 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 16 16" fill="none">
      <path d="M13 3 L3 13 M10 13 L3 13 L3 6" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

function useReveal() {
  useEffect(() => {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          const sib = Array.from(e.target.parentElement.children).filter(c => c.classList && c.classList.contains('reveal'));
          const i = sib.indexOf(e.target);
          e.target.style.transitionDelay = (i * 0.07) + 's';
          e.target.classList.add('in');
          io.unobserve(e.target);
        }
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });
    document.querySelectorAll('.reveal').forEach(el => io.observe(el));
    return () => io.disconnect();
  }, []);
}

      }}>Contact</a>

}

      }}>
        <div className="reveal" style={{ marginBottom: 20 }}>

        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 18 }}>

          <div style={{ width: 8, height: 8, borderRadius: 2, background: 'var(--kelp)' }}></div>
        </div>

        <h1 className="reveal serif" style={{
          fontSize: 'clamp(40px, 6vw, 88px)',

        }}>
          Solar Energy<br/>Forecasting
        </h1>

        <div className="reveal" style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginBottom: 40 }}>
          {['R Shiny', 'Machine Learning', 'Renewable Energy', 'Linear Regression', 'Time Series'].map(tag => (

        }}>
          {[
            ['< 5%', 'monthly nMAE'],
            ['> 0.97', 'model correlation'],
            ['3', 'forecast lead times'],

          ].map(([n, l]) => (
            <div key={l} style={{ padding: '28px 24px', background: 'rgba(255,255,255,0.55)', backdropFilter: 'blur(8px)' }}>

              <div style={{ fontSize: 13, color: 'var(--ink-3)' }}>{l}</div>
            </div>
          ))}
        </div>
      </section>

      {/* Objective */}
      <section style={{ padding: 'clamp(48px, 6vh, 80px) clamp(20px, 4vw, 56px)' }}>
        <div style={{ maxWidth: 1240, margin: '0 auto' }}>
          <div style={{
            display: 'grid',
            gridTemplateColumns: 'minmax(0, 1fr) minmax(0, 1.8fr)',
            gap: 'clamp(32px, 6vw, 96px)',
            alignItems: 'start',
          }}>
            <div className="reveal">
              <div className="eyebrow" style={{ marginBottom: 16 }}>
                <span className="tick"></span>
                <span>01 / Objective</span>
              </div>
              <h2 className="serif" style={{
                fontSize: 'clamp(28px, 3.5vw, 44px)', fontWeight: 400,

              </p>
            </div>
          </div>
        </div>
      </section>

      {/* Method */}
      <section style={{ padding: 'clamp(48px, 6vh, 80px) clamp(20px, 4vw, 56px)', background: 'rgba(255,255,255,0.25)' }}>
        <div style={{ maxWidth: 1240, margin: '0 auto' }}>
          <div className="eyebrow reveal" style={{ marginBottom: 40 }}>
            <span className="tick"></span>
            <span>02 / Methods & Data</span>
          </div>
          <div style={{
            display: 'grid',
            gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))',
            gap: 22,
          }}>
            {[
              ['Modelling',       'Linear regression and machine learning models trained on historical cloud cover, solar irradiance, and electricity production records. Three forecast horizons — 1 hr, 4 hr, 24 hr — calibrated monthly against operational targets.'],
              ['Visualisation',   'Interactive R Shiny dashboard displaying real-time forecasts alongside scheduled maintenance windows, enabling operators to act on predictions without needing to interpret raw model output.'],
              ['Client Interface','Monthly performance calibration sessions and direct client presentations ensured continuous model alignment with evolving operational goals — closing the loop between analytical output and decision-making.'],
            ].map(([t, d], i) => (
              <div key={t} className="reveal glass" style={{ padding: '28px 28px 26px' }}>
                <div className="mono" style={{ fontSize: 11, color: 'var(--ink-4)', letterSpacing: '0.14em', textTransform: 'uppercase', marginBottom: 8 }}>{String(i+1).padStart(2,'0')} ·</div>
                <h3 className="serif" style={{ fontSize: 22, fontWeight: 400, lineHeight: 1.2, color: 'var(--ink)', marginBottom: 14 }}>{t}</h3>
                <p style={{ fontSize: 14, color: 'var(--ink-3)', lineHeight: 1.65 }}>{d}</p>

          </div>

      </section>

      {/* Figures */}
      <section style={{ padding: 'clamp(48px, 6vh, 80px) clamp(20px, 4vw, 56px)' }}>
        <div style={{ maxWidth: 1240, margin: '0 auto' }}>
          <div className="eyebrow reveal" style={{ marginBottom: 40 }}>
            <span className="tick"></span>
            <span>03 / Key Outputs</span>
          </div>

          <div className="reveal glass" style={{ padding: '32px 32px 36px' }}>

            {/* Row 1: Fig1 image | text + Fig2 table inline */}
            <div className="fig-row-2" style={{ display: 'grid', gridTemplateColumns: '1.3fr 1fr', gap: 36, marginBottom: 36, paddingBottom: 36, borderBottom: '1px solid rgba(14,31,36,0.10)', alignItems: 'start' }}>
              <div>
                <div className="fig-img">
                  <img src="https://yushan0989.github.io/portfolio/images/SE_case.png" alt="Daily forecast vs actual generation"/>
