<html lang="en">

<style>
  :root {
    --bone:        #f4f1ea;
    --bone-soft:   #ece7dc;
    --paper:       #fbf9f3;
    --ink:         #0e1f24;
    --ink-2:       #2c4148;
    --ink-3:       #5b7079;
    --ink-4:       #94a4ac;

    --kelp:        oklch(0.62 0.10 165);
    --kelp-deep:   oklch(0.46 0.10 170);
    --kelp-soft:   oklch(0.92 0.04 160);

    --tide:        oklch(0.66 0.09 210);
    --tide-deep:   oklch(0.42 0.08 215);
    --tide-soft:   oklch(0.92 0.03 210);

    --foam:        oklch(0.96 0.02 180);
    --coral:       oklch(0.72 0.13 35);

    --line:        rgba(14,31,36,0.10);
    --line-2:      rgba(14,31,36,0.18);

    --serif: 'Newsreader', 'Cormorant Garamond', Georgia, serif;
    --sans:  'Geist', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    --mono:  'JetBrains Mono', ui-monospace, Menlo, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bone);
    color: var(--ink);
    font-family: var(--sans);
    font-weight: 400;
    line-height: 1.6;
    overflow-x: hidden;
    font-feature-settings: "ss01", "ss02";
    -webkit-font-smoothing: antialiased;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 999;
    opacity: 0.04;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size: 180px;
  }

  #ocean-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  #app {
    position: relative;
    z-index: 1;
  }

  ::selection {
    background: var(--kelp-soft);
    color: var(--ink);
  }

  .mono { font-family: var(--mono); font-variant-ligatures: none; }
  .serif { font-family: var(--serif); font-optical-sizing: auto; }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-3);
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .eyebrow .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: currentColor;
  }
  .eyebrow .tick {
    width: 22px; height: 1px; background: currentColor; opacity: 0.5;
  }

  .glass {
    background: rgba(251, 249, 243, 0.55);
    backdrop-filter: blur(14px) saturate(1.05);
    -webkit-backdrop-filter: blur(14px) saturate(1.05);
    border: 1px solid rgba(255, 255, 255, 0.6);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.7) inset,
      0 30px 60px -28px rgba(14,31,36,0.18),
      0 6px 16px -8px rgba(14,31,36,0.10);
    border-radius: 18px;
  }

  .glass-soft {
    background: rgba(251, 249, 243, 0.42);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: 14px;
  }

  .reveal {
    opacity: 0;
    transform: translateY(22px);
    transition: opacity 0.75s cubic-bezier(0.22, 1, 0.36, 1),
                transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .reveal.in {
    opacity: 1;
    transform: none;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 11px 20px;
    border-radius: 999px;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.01em;
    text-decoration: none;
    cursor: pointer;
    border: 1px solid transparent;
    white-space: nowrap;
    transition: transform 0.2s, box-shadow 0.2s, background 0.2s, color 0.2s, border-color 0.2s;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn .arrow { transition: transform 0.25s; display: inline-block; }
  .btn:hover .arrow { transform: translate(2px, -2px); }

  .btn-primary {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .btn-primary:hover {
    background: var(--kelp-deep);
    border-color: var(--kelp-deep);
    box-shadow: 0 8px 24px -10px var(--kelp-deep);
  }

  .btn-ghost {
    background: rgba(255,255,255,0.45);
    color: var(--ink-2);
    border-color: var(--line-2);
    backdrop-filter: blur(8px);
  }
  .btn-ghost:hover {
    background: rgba(255,255,255,0.85);
    color: var(--ink);
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(14,31,36,0.18);
    border-radius: 999px;
    border: 2px solid var(--bone);
  }
  ::-webkit-scrollbar-thumb:hover { background: rgba(14,31,36,0.32); }

  a:focus-visible, button:focus-visible {
    outline: 2px solid var(--tide-deep);
    outline-offset: 3px;
    border-radius: 6px;
  }

  #cursor-blob {
    position: fixed;
    top: 0; left: 0;
    width: 110px; height: 110px;
    border-radius: 50%;
    background: radial-gradient(circle at center,
      oklch(0.85 0.10 175 / 0.30),
      oklch(0.85 0.10 175 / 0) 60%);
    pointer-events: none;
    z-index: 0;
    transform: translate(-50%, -50%);
    transition: opacity 0.4s;
    opacity: 0;
    will-change: transform;
    filter: blur(8px);
  }

  body.cursor-on #cursor-blob { opacity: 1; }

  #app:empty::before {
    content: '';
    display: block;
    height: 100vh;
    background: var(--bone);
  }
</style>
</head>

<!-- Generative ocean background (vanilla JS) -->
<script>
(function () {
  const canvas = document.getElementById('ocean-bg');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
  let mouseX = 0.5, mouseY = 0.4;
  let scrollY = 0;
  let t = 0;
  let lastFrame = 0;
  let running = true;
  let bgIntensity = 1;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('mousemove', (e) => {
    mouseX = e.clientX / W;
    mouseY = e.clientY / H;
  });
  window.addEventListener('scroll', () => {
    scrollY = window.scrollY;
  }, { passive: true });

  function hash(x, y) {
    const s = Math.sin(x * 374.123 + y * 219.317) * 43758.5453;
    return s - Math.floor(s);
  }
  function smooth(t) { return t * t * (3 - 2 * t); }
  function vnoise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const a = hash(xi, yi);
    const b = hash(xi + 1, yi);
    const c = hash(xi, yi + 1);
    const d = hash(xi + 1, yi + 1);
    const u = smooth(xf), v = smooth(yf);
    return a * (1 - u) * (1 - v) + b * u * (1 - v) + c * (1 - u) * v + d * u * v;
  }
  function fbm(x, y) {
    let v = 0, amp = 0.5, freq = 1;
    for (let i = 0; i < 4; i++) {
      v += vnoise(x * freq, y * freq) * amp;
      amp *= 0.5; freq *= 2;
    }
    return v;
  }

  function draw() {
    if (!running) return;
    const now = performance.now();
    if (now - lastFrame < 33) {
      requestAnimationFrame(draw);
      return;
    }
    lastFrame = now;
    t += 0.0014;

    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#f6f3ec');
    g.addColorStop(0.55, '#eef0e8');
    g.addColorStop(1, '#e6ecea');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    if (bgIntensity <= 0.01) {
      requestAnimationFrame(draw);
      return;
    }

    const cols = 80;
    const rows = Math.round(cols * (H / W));
    const cw = W / cols;
    const ch = H / rows;

    const scrollFactor = scrollY * 0.0008;
    const mx = (mouseX - 0.5) * 0.6;
    const my = (mouseY - 0.5) * 0.6;

    const levels = [0.30, 0.40, 0.50, 0.58, 0.66, 0.74];
    const colors = [
      'rgba(20, 90, 90, 0.04)',
      'rgba(20, 90, 90, 0.06)',
      'rgba(20, 90, 90, 0.08)',
      'rgba(35, 110, 100, 0.10)',
      'rgba(45, 120, 110, 0.12)',
      'rgba(55, 130, 115, 0.14)',
    ];

    const field = new Float32Array((cols + 1) * (rows + 1));
    for (let y = 0; y <= rows; y++) {
      for (let x = 0; x <= cols; x++) {
        const nx = x / cols * 3 + t + mx;
        const ny = y / rows * 3 + scrollFactor + my;
        field[y * (cols + 1) + x] = fbm(nx, ny);
      }
    }

    ctx.lineWidth = 1;
    ctx.lineCap = 'round';

    for (let li = 0; li < levels.length; li++) {
      const level = levels[li];
      ctx.strokeStyle = colors[li].replace(
        /[\d.]+\)$/,
        (m) => (parseFloat(m) * bgIntensity).toFixed(3) + ')'
      );
      ctx.beginPath();

      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const a = field[y * (cols + 1) + x];
          const b = field[y * (cols + 1) + x + 1];
          const c = field[(y + 1) * (cols + 1) + x + 1];
          const d = field[(y + 1) * (cols + 1) + x];

          let idx = 0;
          if (a > level) idx |= 1;
          if (b > level) idx |= 2;
          if (c > level) idx |= 4;
          if (d > level) idx |= 8;
          if (idx === 0 || idx === 15) continue;

          const px = x * cw, py = y * ch;
          const lerp = (v1, v2) => (level - v1) / (v2 - v1);

          const top    = [px + cw * lerp(a, b), py];
          const right  = [px + cw, py + ch * lerp(b, c)];
          const bottom = [px + cw * lerp(d, c), py + ch];
          const left   = [px, py + ch * lerp(a, d)];

          const seg = (p1, p2) => {
            ctx.moveTo(p1[0], p1[1]);
            ctx.lineTo(p2[0], p2[1]);
          };

          switch (idx) {
            case 1: case 14: seg(left, top); break;
            case 2: case 13: seg(top, right); break;
            case 3: case 12: seg(left, right); break;
            case 4: case 11: seg(right, bottom); break;
            case 5: seg(left, top); seg(right, bottom); break;
            case 6: case 9: seg(top, bottom); break;
            case 7: case 8: seg(left, bottom); break;
            case 10: seg(left, bottom); seg(top, right); break;
          }
        }
      }
      ctx.stroke();
    }

    requestAnimationFrame(draw);
  }

  requestAnimationFrame(draw);

  const blob = document.getElementById('cursor-blob');
  let bx = window.innerWidth / 2, by = window.innerHeight / 2;
  let tx = bx, ty = by;
  document.addEventListener('mousemove', (e) => {
    tx = e.clientX; ty = e.clientY;
    document.body.classList.add('cursor-on');
  });
  function tickBlob() {
    bx += (tx - bx) * 0.12;
    by += (ty - by) * 0.12;
    if (blob) blob.style.transform = `translate(${bx}px, ${by}px) translate(-50%, -50%)`;
    requestAnimationFrame(tickBlob);
  }
  tickBlob();

  window.__oceanBg = {
    setIntensity(v) { bgIntensity = Math.max(0, Math.min(1, v)); },
    setRunning(r) { running = r; if (r) requestAnimationFrame(draw); },
  };
})();
</script>

const { useEffect, useRef, useState, useMemo } = React;

function IconArrow({ size = 14 }) {

    <svg width={size} height={size} viewBox="0 0 16 16" fill="none">

function IconWave({ size = 16 }) {

    <svg width={size} height={size} viewBox="0 0 24 16" fill="none">
      <path d="M1 8 Q4 3, 7 8 T13 8 T19 8 T25 8" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round"/>
      <path d="M1 12 Q4 7, 7 12 T13 12 T19 12 T25 12" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" opacity="0.5"/>

}

function IconNode({ size = 14 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 16 16" fill="none">
      <circle cx="3" cy="3" r="1.6" fill="currentColor"/>
      <circle cx="13" cy="3" r="1.6" fill="currentColor"/>
      <circle cx="8" cy="13" r="1.6" fill="currentColor"/>
      <path d="M3 3 L13 3 L8 13 L3 3" stroke="currentColor" strokeWidth="0.8" fill="none" opacity="0.5"/>

}

function Eyebrow({ children, color, num }) {
  return (
    <div className="eyebrow" style={{ color: color || 'var(--ink-3)' }}>
      <span className="tick"></span>
      {num && <span className="mono" style={{ opacity: 0.6 }}>{num}</span>}
      <span>{children}</span>
    </div>
  );
}

function SectionHead({ num, en, zh, color = 'var(--kelp-deep)' }) {
  return (
    <div className="section-head reveal" style={{ marginBottom: 56 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginBottom: 16 }}>
        <span className="mono" style={{ fontSize: 11, color: 'var(--ink-4)', letterSpacing: '0.18em' }}>{num}</span>
        <div style={{ width: 8, height: 8, borderRadius: 2, background: color }}></div>
      </div>
      <h2 className="serif" style={{
        fontSize: 'clamp(36px, 4.6vw, 56px)',
        fontWeight: 400,
        color: 'var(--ink)',
        lineHeight: 1.05,
        letterSpacing: '-0.01em',
      }}>{en}</h2>
    </div>
  );
}

function useReveal() {
  useEffect(() => {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          const sib = Array.from(e.target.parentElement.children)
            .filter((c) => c.classList && c.classList.contains('reveal'));
          const i = sib.indexOf(e.target);
          e.target.style.transitionDelay = (i * 0.07) + 's';
          e.target.classList.add('in');
          io.unobserve(e.target);
        }
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });
    document.querySelectorAll('.reveal').forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, []);
}

function LiveStatus() {
  const [time, setTime] = useState(() => fmt());
  function fmt() {
    const d = new Date();
    return d.toLocaleTimeString('en-GB', {
      hour: '2-digit', minute: '2-digit', second: '2-digit', timeZone: 'Europe/Amsterdam',
    });
  }
  useEffect(() => {
    const id = setInterval(() => setTime(fmt()), 1000);
    return () => clearInterval(id);
  }, []);
  return (
    <div className="mono" style={{
      display: 'inline-flex', alignItems: 'center', gap: 10,
      fontSize: 11, letterSpacing: '0.1em', color: 'var(--ink-3)',
    }}>
      <span style={{
        width: 7, height: 7, borderRadius: '50%',
        background: 'var(--kelp)',
        boxShadow: '0 0 0 4px rgba(110,180,150,0.18)',
        animation: 'livePulse 2s ease-in-out infinite',
      }}></span>
      <span>AMS · {time}</span>
    </div>
  );
}

(function injectKeys() {
  if (document.getElementById('kf-extra')) return;
  const s = document.createElement('style');
  s.id = 'kf-extra';
  s.textContent = `
    @keyframes livePulse {
      0%, 100% { box-shadow: 0 0 0 4px rgba(110,180,150,0.16); }
      50%      { box-shadow: 0 0 0 8px rgba(110,180,150,0.04); }
    }
    @keyframes spinSlow { to { transform: rotate(360deg); } }
    @keyframes drift {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-8px) rotate(1deg); }
    }
    @keyframes shimmer {
      0%   { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    @keyframes barfill {
      from { transform: scaleX(0); }
      to   { transform: scaleX(var(--bar-target, 1)); }
    }
    .reveal.in .bar-fill {
      animation: barfill 1.1s 0.3s cubic-bezier(0.22,1,0.36,1) both;
    }
    a.proj-card { display: block; text-decoration: none; color: inherit; }
    a.proj-card:hover .proj-img { transform: scale(1.04); filter: saturate(1) contrast(1.02); }
    a.proj-card:hover .proj-arrow { transform: translate(2px, -2px); color: var(--kelp-deep); }
  `;
  document.head.appendChild(s);
})();

function MiniLine({ data, color = 'var(--kelp-deep)', height = 36, width = 110 }) {
  const max = Math.max(...data), min = Math.min(...data);
  const range = max - min || 1;
  const pts = data.map((v, i) => {
    const x = (i / (data.length - 1)) * width;
    const y = height - ((v - min) / range) * (height - 4) - 2;
    return [x, y];
  });
  const path = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const fill = path + ` L ${width} ${height} L 0 ${height} Z`;
  return (
    <svg width={width} height={height} style={{ display: 'block' }}>
      <path d={fill} fill={color} opacity="0.10"/>
      <path d={path} fill="none" stroke={color} strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
      {pts.map(([x, y], i) => i === pts.length - 1 ? (
        <circle key={i} cx={x} cy={y} r="2.5" fill={color}/>
      ) : null)}
    </svg>
  );
}

// HERO (hero.jsx)
// ─────────────────────────────────────────────

const { useEffect: useEffectH, useRef: useRefH, useState: useStateH } = React;

function HeroNetwork() {
  const cvs = useRefH(null);
  useEffectH(() => {
    const c = cvs.current;
    if (!c) return;
    const ctx = c.getContext('2d');
    const DPR = Math.min(window.devicePixelRatio || 1, 2);
    let W = c.clientWidth, H = c.clientHeight;
    let mx = W / 2, my = H / 2, hovering = false;
    let rafId = 0;

    function size() {
      W = c.clientWidth; H = c.clientHeight;
      c.width = W * DPR; c.height = H * DPR;
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    size();
    const ro = new ResizeObserver(size);
    ro.observe(c);

    const nodes = [];
    const rings = [
      { r: 0.18, n: 6, kind: 'core' },
      { r: 0.32, n: 10, kind: 'mid' },
      { r: 0.46, n: 14, kind: 'edge' },
    ];
    rings.forEach((ring) => {
      for (let i = 0; i < ring.n; i++) {
        const a = (i / ring.n) * Math.PI * 2 + Math.random() * 0.4;
        const r = ring.r + (Math.random() - 0.5) * 0.04;
        nodes.push({ a, r, kind: ring.kind, jx: 0, jy: 0, phase: Math.random() * Math.PI * 2 });
      }
    });

    let t = 0;
    function draw() {
      t += 0.006;
      ctx.clearRect(0, 0, W, H);
      const cx = W / 2, cy = H / 2;
      const baseR = Math.min(W, H);

      const positions = nodes.map((n) => {
        const wob = Math.sin(t + n.phase) * 0.005;
        const rr = (n.r + wob) * baseR;
        const x = cx + Math.cos(n.a + t * 0.04) * rr;
        const y = cy + Math.sin(n.a + t * 0.04) * rr;
        const dx = mx - x, dy = my - y;
        const d = Math.hypot(dx, dy);
        let ox = 0, oy = 0;
        if (hovering && d < 140) {
          const f = (1 - d / 140) * 18;
          ox = -dx / d * f;
          oy = -dy / d * f;
        }
        return [x + ox, y + oy, n.kind];
      });

      ctx.lineWidth = 0.8;
      for (let i = 0; i < positions.length; i++) {
        for (let j = i + 1; j < positions.length; j++) {
          const dx = positions[i][0] - positions[j][0];
          const dy = positions[i][1] - positions[j][1];
          const d = Math.hypot(dx, dy);
          if (d < 110) {
            const a = (1 - d / 110) * 0.35;
            ctx.strokeStyle = `rgba(20, 80, 80, ${a.toFixed(3)})`;
            ctx.beginPath();
            ctx.moveTo(positions[i][0], positions[i][1]);
            ctx.lineTo(positions[j][0], positions[j][1]);
            ctx.stroke();
          }
        }
      }

      positions.forEach(([x, y, kind]) => {
        const isCore = kind === 'core';
        const isMid = kind === 'mid';
        const r = isCore ? 4 : isMid ? 2.6 : 1.8;
        ctx.fillStyle = isCore ? 'rgba(28,80,75,0.95)'
                       : isMid ? 'rgba(40,100,90,0.78)'
                               : 'rgba(60,120,100,0.55)';
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
        if (isCore) {
          ctx.strokeStyle = 'rgba(28,80,75,0.20)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(x, y, r + 4, 0, Math.PI * 2);
          ctx.stroke();
        }
      });

      rafId = requestAnimationFrame(draw);
    }
    draw();

    function move(e) {
      const rect = c.getBoundingClientRect();
      mx = e.clientX - rect.left;
      my = e.clientY - rect.top;
      hovering = true;
    }
    function leave() { hovering = false; }
    c.addEventListener('mousemove', move);
    c.addEventListener('mouseleave', leave);

    return () => {
      cancelAnimationFrame(rafId);
      ro.disconnect();
      c.removeEventListener('mousemove', move);
      c.removeEventListener('mouseleave', leave);
    };
  }, []);

  return (
    <canvas ref={cvs} style={{ position: 'absolute', inset: 0, width: '100%', height: '100%' }}/>
  );
}

function ProjectGlyph({ kind, color }) {
  const W = 560, H = 320;
  const base = 'rgba(14, 31, 36, 0.04)';

  const compositions = {
    solar: () => {
      const rays = [];
      for (let i = 0; i < 36; i++) {
        const a = (i / 36) * Math.PI * 2;
        const r1 = 60, r2 = 60 + 4 + (i % 5) * 10;
        rays.push(
          <line key={i}
            x1={W/2 + Math.cos(a) * r1} y1={H/2 + Math.sin(a) * r1}
            x2={W/2 + Math.cos(a) * r2} y2={H/2 + Math.sin(a) * r2}
            stroke={color} strokeWidth="1" opacity={0.5 + (i % 3) * 0.15}/>
        );
      }
      return (<>
        {rays}
        <circle cx={W/2} cy={H/2} r="48" fill={color} opacity="0.12"/>
        <circle cx={W/2} cy={H/2} r="32" fill="none" stroke={color} strokeWidth="1.2"/>
        <circle cx={W/2} cy={H/2} r="6" fill={color}/>
      </>);
    },
    hydro: () => {
      const waves = [];
      for (let i = 0; i < 7; i++) {
        const y = 80 + i * 32;
        const amp = 8 + i * 2;
        const path = [];
        for (let x = 0; x <= W; x += 8) {
          const py = y + Math.sin((x / W) * Math.PI * 4 + i) * amp;
          path.push((x === 0 ? 'M' : 'L') + x + ' ' + py.toFixed(1));
        }
        waves.push(<path key={i} d={path.join(' ')} fill="none" stroke={color} strokeWidth="1" opacity={0.18 + i * 0.08}/>);
      }
      return (<>{waves}</>);
    },
    wind: () => {
      const items = [];
      for (let i = 0; i < 5; i++) {
        const cx = 80 + i * 110;
        items.push(
          <g key={i} transform={`translate(${cx},${H/2})`}>
            <circle r="3" fill={color}/>
            <line x1="0" y1="0" x2="0" y2="-50" stroke={color} strokeWidth="1.2"/>
            <line x1="0" y1="-50" x2="32" y2="-62" stroke={color} strokeWidth="1.4"/>
            <line x1="0" y1="-50" x2="-22" y2="-72" stroke={color} strokeWidth="1.4"/>
            <line x1="0" y1="-50" x2="-12" y2="-22" stroke={color} strokeWidth="1.4"/>
            <line x1="0" y1="0" x2="0" y2="50" stroke={color} strokeWidth="0.8" opacity="0.3" strokeDasharray="2 4"/>
          </g>
        );
      }
      for (let j = 0; j < 14; j++) {
        const y = 30 + j * 18;
        items.push(
          <path key={'s' + j} d={`M0 ${y} Q 140 ${y - 6}, 280 ${y} T ${W} ${y}`}
            fill="none" stroke={color} strokeWidth="0.6" opacity="0.18"/>
        );
      }
      return (<>{items}</>);
    },
    typhoon: () => {
      const arms = [];
      for (let a = 0; a < 360; a += 6) {
        const rad = (a * Math.PI) / 180;
        const r0 = 14, r1 = 14 + Math.pow(a / 360, 1.4) * 110;
        const x1 = W/2 + Math.cos(rad) * r0;
        const y1 = H/2 + Math.sin(rad) * r0;
        const x2 = W/2 + Math.cos(rad + 1.6) * r1;
        const y2 = H/2 + Math.sin(rad + 1.6) * r1;
        arms.push(
          <line key={a} x1={x1} y1={y1} x2={x2} y2={y2}
            stroke={color} strokeWidth="0.8" opacity={0.15 + (a / 360) * 0.4}/>
        );
      }
      return (<>
        {arms}
        <circle cx={W/2} cy={H/2} r="8" fill={color}/>
      </>);
    },
    lightning: () => {
      const bolts = [];
      for (let i = 0; i < 4; i++) {
        const sx = 80 + i * 130;
        const path = `M${sx} 40 L${sx - 12} 130 L${sx + 6} 130 L${sx - 18} 240 L${sx + 14} 150 L${sx - 4} 150 Z`;
        bolts.push(<path key={i} d={path} fill={color} opacity={0.18 + i * 0.12}/>);
      }
      const dots = [];
      for (let i = 0; i < 80; i++) {
        const x = (i * 73) % W;
        const y = (i * 41) % H;
        dots.push(<circle key={'d' + i} cx={x} cy={y} r="0.8" fill={color} opacity="0.4"/>);
      }
      return (<>{dots}{bolts}</>);
    },
    consumer: () => {
      const bars = [];
      for (let i = 0; i < 24; i++) {
        const h = 30 + Math.sin(i * 0.6) * 60 + 60;
        const x = 30 + i * 21;
        bars.push(<rect key={i} x={x} y={H - h - 40} width="12" height={h} fill={color} opacity={0.18 + (i % 3) * 0.08}/>);
      }
      const path = [];
      for (let i = 0; i < 24; i++) {
        const x = 36 + i * 21;
        const y = H - 40 - (30 + Math.sin(i * 0.6 + 0.4) * 60 + 60);
        path.push((i === 0 ? 'M' : 'L') + x + ' ' + y);
      }
      return (<>
        {bars}
        <path d={path.join(' ')} fill="none" stroke={color} strokeWidth="1.5"/>
      </>);
    },
  };

  return (
    <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="xMidYMid slice"
      style={{ width: '100%', height: '100%', display: 'block' }}>
      <rect width={W} height={H} fill={base}/>
      {compositions[kind] && compositions[kind]()}
    </svg>
  );
}

function FooterCounter() {
  const [count, setCount] = useState(0);
  const [pct, setPct] = useState(0);
  const [nextGoal, setNextGoal] = useState(10);

  useEffect(() => {
    const stored = JSON.parse(localStorage.getItem('yl_visits') || '{"count":0}');
    const n = stored.count + 1;
    localStorage.setItem('yl_visits', JSON.stringify({ count: n }));
    const milestones = [10, 50, 100, 500, 1000, 5000, 10000];
    const goal = milestones.find(function(m) { return m > n; }) || n * 2;
    setCount(n);
    setPct(Math.min(n / goal, 1));
    setNextGoal(goal);
  }, []);

  return (
    <div style={{
      paddingTop: 16,
      borderTop: '1px solid rgba(244,241,234,0.08)',
      display: 'flex', alignItems: 'center', gap: 14, flexWrap: 'wrap',
    }}>
      <span style={{
        width: 6, height: 6, borderRadius: '50%', flexShrink: 0,
        background: '#6eb49a', opacity: 0.8,
        animation: 'livePulse 2s ease-in-out infinite',
      }}/>
      <span className="mono" style={{ fontSize: 11, color: 'rgba(244,241,234,0.55)', letterSpacing: '0.08em', whiteSpace: 'nowrap' }}>
        {count} visits this browser
      </span>
      <div style={{ flex: 1, minWidth: 80, height: 2, borderRadius: 999, background: 'rgba(244,241,234,0.08)', overflow: 'hidden' }}>
        <div style={{
          height: '100%', borderRadius: 999,
          width: Math.round(pct * 100) + '%',
          background: 'rgba(110,180,154,0.6)',
          transition: 'width 1.2s cubic-bezier(0.22,1,0.36,1)',
        }}/>
      </div>
      <span className="mono" style={{ fontSize: 10, color: 'rgba(244,241,234,0.28)', letterSpacing: '0.06em', whiteSpace: 'nowrap' }}>
        next · {nextGoal}
      </span>
    </div>
  );
}

function FloatingNav() {
  const [active, setActive] = useState('hero');
  useEffect(() => {
    const ids = ['projects', 'skills', 'about', 'contact'];
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) setActive(e.target.id); });
    }, { rootMargin: '-40% 0px -50% 0px' });
    ids.forEach((id) => { const el = document.getElementById(id); if (el) io.observe(el); });
    return () => io.disconnect();
  }, []);

  const links = [
    ['projects', 'Projects'],
    ['skills',   'Skills'],
    ['about',    'About'],
    ['contact',  'Contact'],
  ];

  return (
    <nav style={{
      position: 'fixed', top: 24, left: '50%', transform: 'translateX(-50%)',
      zIndex: 100, padding: '10px 14px', borderRadius: 999,
      background: 'rgba(251,249,243,0.78)',
      backdropFilter: 'blur(20px) saturate(1.4)',
      border: '1px solid rgba(255,255,255,0.6)',
      boxShadow: '0 10px 40px -12px rgba(14,31,36,0.18)',
      display: 'flex', gap: 4, alignItems: 'center',
    }}>
      <a href="#" style={{
        fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--ink-2)',
        letterSpacing: '0.1em', padding: '6px 12px', borderRadius: 999, textDecoration: 'none',
      }}>YL</a>
      <span style={{ width: 1, height: 18, background: 'var(--line)', margin: '0 4px' }}></span>
      {links.map(([id, label]) => (
        <a key={id} href={`#${id}`} style={{
          fontSize: 12.5, padding: '6px 12px', borderRadius: 999, textDecoration: 'none',
          color: active === id ? 'var(--paper)' : 'var(--ink-2)',
          background: active === id ? 'var(--ink)' : 'transparent',
          transition: 'background 0.25s, color 0.25s',
        }}>{label}</a>
      ))}
    </nav>
  );
}
