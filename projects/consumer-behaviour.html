<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script>
(function () {
  const canvas = document.getElementById('ocean-bg');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
  let mouseX=0.5,mouseY=0.4,scrollY=0,t=0,lastFrame=0;

  function resize() {
    W=window.innerWidth; H=window.innerHeight;
    canvas.width=W*DPR; canvas.height=H*DPR;
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  resize();
  window.addEventListener('resize',resize);
  window.addEventListener('mousemove',(e)=>{mouseX=e.clientX/W;mouseY=e.clientY/H;});
  window.addEventListener('scroll',()=>{scrollY=window.scrollY;},{passive:true});

  function hash(x,y){const s=Math.sin(x*374.123+y*219.317)*43758.5453;return s-Math.floor(s);}
  function smooth(t){return t*t*(3-2*t);}
  function vnoise(x,y){
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);
    const u=smooth(xf),v=smooth(yf);
    return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
  }
  function fbm(x,y){let v=0,amp=0.5,freq=1;for(let i=0;i<4;i++){v+=vnoise(x*freq,y*freq)*amp;amp*=0.5;freq*=2;}return v;}

  function draw(){
    const now=performance.now();
    if(now-lastFrame<33){requestAnimationFrame(draw);return;}
    lastFrame=now; t+=0.0014;
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#f6f3ec');g.addColorStop(0.55,'#eef0e8');g.addColorStop(1,'#e6ecea');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    const cols=80,rows=Math.round(cols*(H/W)),cw=W/cols,ch=H/rows;
    const sf=scrollY*0.0008,mx=(mouseX-0.5)*0.6,my=(mouseY-0.5)*0.6;
    const levels=[0.30,0.40,0.50,0.58,0.66,0.74];
    const colors=['rgba(20,90,90,0.04)','rgba(20,90,90,0.06)','rgba(20,90,90,0.08)','rgba(35,110,100,0.10)','rgba(45,120,110,0.12)','rgba(55,130,115,0.14)'];
    const field=new Float32Array((cols+1)*(rows+1));
    for(let y=0;y<=rows;y++)for(let x=0;x<=cols;x++)field[y*(cols+1)+x]=fbm(x/cols*3+t+mx,y/rows*3+sf+my);
    ctx.lineWidth=1; ctx.lineCap='round';
    for(let li=0;li<levels.length;li++){
      const level=levels[li];
      ctx.strokeStyle=colors[li];
      ctx.beginPath();
      for(let y=0;y<rows;y++){
        for(let x=0;x<cols;x++){
          const a=field[y*(cols+1)+x],b=field[y*(cols+1)+x+1],c=field[(y+1)*(cols+1)+x+1],d=field[(y+1)*(cols+1)+x];
          let idx=0;
          if(a>level)idx|=1;if(b>level)idx|=2;if(c>level)idx|=4;if(d>level)idx|=8;
          if(idx===0||idx===15)continue;
          const px=x*cw,py=y*ch,lerp=(v1,v2)=>(level-v1)/(v2-v1);
          const top=[px+cw*lerp(a,b),py],right=[px+cw,py+ch*lerp(b,c)],bottom=[px+cw*lerp(d,c),py+ch],left=[px,py+ch*lerp(a,d)];
          const seg=(p1,p2)=>{ctx.moveTo(p1[0],p1[1]);ctx.lineTo(p2[0],p2[1]);};
          switch(idx){
            case 1:case 14:seg(left,top);break;case 2:case 13:seg(top,right);break;
            case 3:case 12:seg(left,right);break;case 4:case 11:seg(right,bottom);break;
            case 5:seg(left,top);seg(right,bottom);break;case 6:case 9:seg(top,bottom);break;
            case 7:case 8:seg(left,bottom);break;case 10:seg(left,bottom);seg(top,right);break;
          }
        }
      }
      ctx.stroke();
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  const blob=document.getElementById('cursor-blob');
  let bx=window.innerWidth/2,by=window.innerHeight/2,tx=bx,ty=by;
  document.addEventListener('mousemove',(e)=>{tx=e.clientX;ty=e.clientY;document.body.classList.add('cursor-on');});
  function tickBlob(){bx+=(tx-bx)*0.12;by+=(ty-by)*0.12;if(blob)blob.style.transform=`translate(${bx}px,${by}px) translate(-50%,-50%)`;requestAnimationFrame(tickBlob);}
  tickBlob();
})();
</script>

<script type="text/babel">
const { useEffect, useState } = React;

function IconArrow({ size = 14 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 16 16" fill="none">
      <path d="M3 13 L13 3 M6 3 L13 3 L13 10" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

function IconArrowLeft({ size = 14 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 16 16" fill="none">
      <path d="M13 3 L3 13 M10 13 L3 13 L3 6" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

function useReveal() {
  useEffect(() => {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          const sib = Array.from(e.target.parentElement.children).filter(c => c.classList && c.classList.contains('reveal'));
          const i = sib.indexOf(e.target);
          e.target.style.transitionDelay = (i * 0.07) + 's';
          e.target.classList.add('in');
          io.unobserve(e.target);
        }
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });
    document.querySelectorAll('.reveal').forEach(el => io.observe(el));
    return () => io.disconnect();
  }, []);
}

}

function ProjectPage() {

  return (
    <div style={{ minHeight: '100vh' }}>

      <section style={{
        paddingTop: 'clamp(100px, 14vh, 140px)',
        paddingBottom: 'clamp(40px, 6vh, 72px)',

        maxWidth: 1240, margin: '0 auto',
      }}>
        <div className="reveal" style={{ marginBottom: 20 }}>
          <a href="https://yushan0989.github.io/portfolio/#projects" style={{
            display: 'inline-flex', alignItems: 'center', gap: 8,
            fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--ink-4)',
            letterSpacing: '0.1em', textDecoration: 'none',
            transition: 'color 0.2s',
          }}
          onMouseEnter={e => e.currentTarget.style.color = 'var(--kelp-deep)'}
          onMouseLeave={e => e.currentTarget.style.color = 'var(--ink-4)'}

          </a>
        </div>

        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 18 }}>
          <span className="mono reveal" style={{ fontSize: 11, color: 'var(--ink-4)', letterSpacing: '0.18em' }}>P_006</span>
          <div style={{ width: 8, height: 8, borderRadius: 2, background: 'var(--kelp)' }}></div>
        </div>

        <h1 className="reveal serif" style={{
          fontSize: 'clamp(40px, 6vw, 88px)',
          lineHeight: 0.95, fontWeight: 400, color: 'var(--ink)',
          letterSpacing: '-0.02em', marginBottom: 28,
        }}>
          Weather–Consumer<br/>Behaviour
        </h1>

        <div className="reveal" style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginBottom: 40 }}>
          {['Sampling Validation', 'Statistical Inference', 'Business Strategy'].map(tag => (
            <span key={tag} className="mono" style={{
              fontSize: 11, padding: '5px 12px', borderRadius: 999,

            }}>{tag}</span>
          ))}

        {/* Summary stat strip */}
        <div className="reveal" style={{
          display: 'grid',
          gridTemplateColumns: 'repeat(auto-fit, minmax(160px, 1fr))',
          gap: 1, background: 'var(--line)',
          borderRadius: 16, overflow: 'hidden', border: '1px solid var(--line)',
          marginBottom: 0,
        }}>
          {[
            ['9.2M', 'invoice records (2018)'],
            ['p < 0.001', 'statistical significance'],
            ['~50%', 'sales uplift at threshold'],
            ['19°C / 23°C', 'regional thresholds (N/S)'],
          ].map(([n, l]) => (
            <div key={l} style={{ padding: '28px 24px', background: 'rgba(255,255,255,0.55)', backdropFilter: 'blur(8px)' }}>
              <div className="serif" style={{ fontSize: 'clamp(28px, 3.5vw, 44px)', lineHeight: 1, color: 'var(--ink)', fontWeight: 400, letterSpacing: '-0.02em', marginBottom: 10 }}>{n}</div>
              <div style={{ fontSize: 13, color: 'var(--ink-3)' }}>{l}</div>
            </div>
          ))}
        </div>
      </section>

      {/* Objective */}
      <section style={{ padding: 'clamp(48px, 6vh, 80px) clamp(20px, 4vw, 56px)' }}>
        <div style={{ maxWidth: 1240, margin: '0 auto' }}>
          <div style={{
            display: 'grid',
            gridTemplateColumns: 'minmax(0, 1fr) minmax(0, 1.8fr)',
            gap: 'clamp(32px, 6vw, 96px)',
            alignItems: 'start',
          }}>
            <div className="reveal">
              <div className="eyebrow" style={{ marginBottom: 16 }}>
                <span className="tick"></span>
                <span>01 / Objective</span>
              </div>
              <h2 className="serif" style={{
                fontSize: 'clamp(28px, 3.5vw, 44px)', fontWeight: 400,
                lineHeight: 1.1, color: 'var(--ink)', letterSpacing: '-0.01em',
              }}>
                Localised weather signals as demand drivers.
              </h2>
            </div>
            <div className="reveal" style={{ fontSize: 17, lineHeight: 1.8, color: 'var(--ink-2)' }}>
              <p style={{ marginBottom: 16 }}>
                National supply chain planning for weather-sensitive retail products typically relies on broad seasonal patterns — ignoring the behavioural reality that consumers in different climate zones respond to temperature differently. This project challenged that assumption using 9.2 million electronic invoice records from 2018 to decode how localised cold-weather perception drives purchasing behaviour.
              </p>
              <p>
                By establishing region-specific temperature thresholds — 19°C in northern cities, 23°C in southern cities — the analysis demonstrated that identical behavioural responses emerge across geographically diverse markets despite different absolute temperature triggers.
              </p>
            </div>
          </div>
        </div>
      </section>

      {/* Method */}
      <section style={{ padding: 'clamp(48px, 6vh, 80px) clamp(20px, 4vw, 56px)', background: 'rgba(255,255,255,0.25)' }}>
        <div style={{ maxWidth: 1240, margin: '0 auto' }}>

            <span className="tick"></span>
            <span>02 / Methods & Data</span>
          </div>
          <div style={{
            display: 'grid',
            gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))',
            gap: 22,
          }}>
            {[
              ['Sampling Validation', 'Sampling methodology validated against Ministry of Finance electronic invoice statistics to confirm representativeness across the full national dataset of 9.2 million records. Rigorous validation ensured statistical inferences were grounded in a reliable sample frame.'],
              ['Statistical Inference', 'Two-sample t-tests confirmed significant differences in daily sales volume above and below regional temperature thresholds (p < 0.001). Regression analysis quantified the negative correlation between observed temperature and sales volume across both geographic regions.'],
              ['Regional Analysis', 'Separate analyses for high-latitude (north) and low-latitude (south) cities revealed consistent ~50% sales increases when local thresholds were crossed — from 20 to 28 units in the north and 11 to 14 units in the south — validating the relativistic framing of consumer cold-weather perception.'],
            ].map(([t, d], i) => (
              <div key={t} className="reveal glass" style={{ padding: '28px 28px 26px' }}>
                <div className="mono" style={{ fontSize: 11, color: 'var(--ink-4)', letterSpacing: '0.14em', textTransform: 'uppercase', marginBottom: 8 }}>{String(i+1).padStart(2,'0')} ·</div>
                <h3 className="serif" style={{ fontSize: 22, fontWeight: 400, lineHeight: 1.2, color: 'var(--ink)', marginBottom: 14 }}>{t}</h3>
                <p style={{ fontSize: 14, color: 'var(--ink-3)', lineHeight: 1.65 }}>{d}</p>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* Figures */}
      <section style={{ padding: 'clamp(48px, 6vh, 80px) clamp(20px, 4vw, 56px)' }}>
        <div style={{ maxWidth: 1240, margin: '0 auto' }}>
          <div className="eyebrow reveal" style={{ marginBottom: 40 }}>
            <span className="tick"></span>
            <span>03 / Key Outputs</span>
          </div>

          <div className="reveal glass" style={{ padding: '32px 32px 36px' }}>

            {/* Row 1: Fig1 + Fig2 side by side */}
            <div className="fig-row-eq" style={{ display: 'grid', gridTemplateColumns: '0.98fr 1.05fr', gap: 24, marginBottom: 16 }}>
              <div>
                <div className="fig-img"><img src="https://yushan0989.github.io/portfolio/images/CB_data.png" alt="Invoice sample vs MoF statistics"/></div>
                <p className="fig-cap">Figure 1. Number of electronic invoices from Ministry of Finance statistics vs. sample size.</p>
              </div>
              <div>
                <div className="fig-img"><img src="https://yushan0989.github.io/portfolio/images/CB_correlation.png" alt="Temperature vs Sales regression"/></div>
                <p className="fig-cap">Figure 2. Regression Analysis of Observed Temperature vs. Daily Sales Volume.</p>
              </div>
